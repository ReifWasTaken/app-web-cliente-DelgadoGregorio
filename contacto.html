<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Comidas Zulma</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Comidas Zulma</h1>
        <p>Sabores argentinos auténticos</p>
    </header>

    <main>
        <section class="contacto">
            <h2>Hace tu pedido aquí</h2>
            <form>
                <div class="form-group">
                    <label for="pedido">Pedido:</label>
                    <textarea id="pedido" name="pedido" rows="5" cols="50" pattern="[a-zA-Z0-9ÁÉÍÓÚáéíóúñÑ\s]*" required></textarea>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono" pattern="[0-9]*" required>
                </div>
                <div class="form-group">
                    <label for="modalidad">Modalidad de entrega:</label>
                    <select id="modalidad" name="modalidad" required>
                        <option value="retiro">Retiro por el local</option>
                        <option value="envio">Envio a domicilio</option>
                    </select>
                </div>
                <button type="submit">Enviar pedido</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Comidas Zulma. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
